name: Update lottery results

on:
  schedule:
    # Draws are on the 1st and 16th (results out around 16:00 Thai time = 09:00 UTC).
    # Check that evening and the next two days, since draw dates sometimes shift.
    - cron: "0 11,14 1,2,3,16,17,18 * *"
    # Weekly safety check for draws held on unusual dates (e.g. 17 Jan, 2 May, 30 Dec)
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_data.py
      - name: Commit new results
        run: |
          if git diff --quiet data.json; then
            echo "No new draws"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Add latest lottery results"
          git push
